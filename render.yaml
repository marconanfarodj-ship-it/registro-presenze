services:
  - type: web
    name: registro-presenze
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: registro-presenze-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_PATH
        value: /data/app.db
      - key: NODE_ENV
        value: production
